:root {
	--sky-top: #0a7cfd;
	--u: min(100vw / 720, 100vh / 1280);
	--brown: #4a2a12;
	--wood: #8a5a2b;
	--cream: #fff6dc;
	--cream-dark: #ecd6a2;
	--gold-1: #ffe46b;
	--gold-2: #ffc21a;
	--gold-3: #f29a00;
	--font: 'SproutFredoka', 'SproutNunito', 'Fredoka', 'Baloo 2', 'Nunito', 'Varela Round', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	/* No pull-to-refresh nor bounce of the page (phones), also on this loading screen (the engine's own touch
	   handlers only exist on the canvas). */
	overscroll-behavior: none;
}

body {
	color: var(--cream);
	/* Same sky as the overlay: no black/white flash before or after the game draws. */
	background: var(--sky-top) linear-gradient(180deg, #0a7cfd 0%, #2aa6fd 55%, #7fd9fb 100%) no-repeat fixed;
	overflow: hidden;
	touch-action: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;

}

}

}

}

	transition: opacity 0.5s ease, transform 0.5s ease;
}

#status.is-leaving {
	opacity: 0;
	transform: scale(1.03);
	pointer-events: none;
}

/* title-screen meadow (same placement as scenes/title.tscn: 620 units high, anchored at the bottom,
   1 unit = window / base size, base 720x1280 in portrait, 1520x860 in landscape — see scenes/screen_fit.gd) */
#meadow {
	position: absolute;
	left: 0;
	bottom: 0;
	width: 100%;
	height: calc(620 * var(--u));
	object-fit: cover;
	object-position: 50% 50%;
	pointer-events: none;
}

/* centred column */
#loader {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: clamp(10px, 2.4vh, 22px);
	padding: env(safe-area-inset-top, 0) 16px calc(12vh + env(safe-area-inset-bottom, 0)) 16px;
	box-sizing: border-box;
	text-align: center;
}

#logo {
	display: block;
	width: min(88vw, 560px, 62vh * 1.66);
	height: auto;
	filter: drop-shadow(0 8px 0 rgba(20, 70, 140, 0.25));
	animation: breathe 2.4s ease-in-out infinite;
	transform-origin: 50% 60%;
}

@keyframes breathe {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.035); }
}

#crops {
	display: flex;
	align-items: flex-end;
	justify-content: center;
	gap: clamp(4px, 1.5vw, 14px);
	/* 4 crops (~1.1:1) must fit the phone width */
	height: max(44px, min(12vh, 104px, 20vw));
}

#crops img {
	height: 100%;
	width: auto;
	filter: drop-shadow(0 5px 0 rgba(40, 60, 20, 0.22));
	animation: hop 1.8s ease-in-out infinite;
	transform-origin: 50% 100%;
}

#crops img:nth-child(2) { animation-delay: 0.22s; }
#crops img:nth-child(3) { animation-delay: 0.44s; }
#crops img:nth-child(4) { animation-delay: 0.66s; }

@keyframes hop {
	0%, 40%, 100% { transform: translateY(0) scale(1, 1); }
	8% { transform: translateY(0) scale(1.08, 0.9); }
	20% { transform: translateY(-26%) scale(0.95, 1.06); }
	32% { transform: translateY(0) scale(1.06, 0.94); }
}

/* chunky wooden progress bar */
#bar {
	position: relative;
	width: min(84vw, 480px);
	height: clamp(40px, 6vh, 52px);
	box-sizing: border-box;
	border: 5px solid var(--brown);
	border-radius: 999px;
	background: linear-gradient(180deg, var(--cream-dark) 0%, var(--cream) 55%);
	box-shadow: 0 6px 0 var(--brown), inset 0 4px 0 rgba(120, 70, 20, 0.22);
	overflow: hidden;
}

#bar-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	min-width: 0;
	border-radius: 999px;
	background:
		linear-gradient(180deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.55) 26%, rgba(255, 255, 255, 0) 27%),
		repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.0) 0 12px, rgba(255, 255, 255, 0.22) 12px 22px),
		linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 55%, var(--gold-3) 100%);
	background-size: 100% 100%, 31px 100%, 100% 100%;
	box-shadow: inset -3px 0 0 rgba(150, 80, 0, 0.35), inset 0 -4px 0 rgba(170, 90, 0, 0.35);
	animation: stripes 0.9s linear infinite;
}

@keyframes stripes {
	from { background-position: 0 0, 0 0, 0 0; }
	to { background-position: 0 0, 31px 0, 0 0; }
}

#bar-text {
	position: absolute;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--brown);
	font-size: clamp(18px, 3vh, 24px);
	letter-spacing: 0.02em;
	text-shadow: 0 0 6px rgba(255, 250, 230, 0.9), 0 0 2px rgba(255, 250, 230, 1);
}

.outlined {
	color: #fff;
	text-shadow:
		-2px -2px 0 var(--brown), 2px -2px 0 var(--brown), -2px 2px 0 var(--brown), 2px 2px 0 var(--brown),
		0 -2px 0 var(--brown), 0 2px 0 var(--brown), -2px 0 0 var(--brown), 2px 0 0 var(--brown),
		0 4px 0 var(--brown);
}

#status-text {
	margin: 4px 0 0;
	min-height: 1.3em;
	font-size: clamp(21px, 3.6vh, 30px);
	transition: opacity 0.25s ease;
}

#tip {
	position: absolute;
	left: 50%;
	bottom: calc(max(14px, 3.5vh) + env(safe-area-inset-bottom, 0));
	transform: translateX(-50%);
	width: max-content;
	max-width: calc(100% - 32px);
	box-sizing: border-box;
	padding: 8px 18px 9px;
	border: 4px solid var(--brown);
	border-radius: 18px;
	background: var(--cream);
	box-shadow: 0 4px 0 var(--brown);
	color: var(--brown);
	font-size: clamp(15px, 2.2vh, 19px);
	line-height: 1.25;
	text-align: center;
	transition: opacity 0.3s ease;
}

#tip b {
	color: #d9761a;
	font-weight: 600;
}

.fade {
	opacity: 0;
}

/* error notice (missing browser features, failed download...) */
#status-notice {
	display: none;
	max-width: min(86vw, 460px);
	box-sizing: border-box;
	padding: 14px 18px;
	border: 5px solid var(--brown);
	border-radius: 20px;
	background: var(--cream);
	box-shadow: 0 6px 0 var(--brown);
	color: var(--brown);
	font-size: 17px;
	line-height: 1.35;
	overflow-wrap: anywhere;
}

#status.is-error #bar, #status.is-error #status-text, #status.is-error #crops, #status.is-error #tip { display: none; }
#status.is-error #status-notice { display: block; }

/* small landscape screens (phones turned sideways) */
@media (max-height: 480px) {
	#loader { padding-bottom: 12vh; gap: 8px; }
	#logo { width: min(60vw, 50vh * 1.66); }
	#tip { display: none; }
}

@media (orientation: landscape) {
	:root { --u: min(100vw / 1520, 100vh / 860); }
}

@media (prefers-reduced-motion: reduce) {
	#logo, #crops img, #bar-fill { animation: none !important; }
	#status, #status-text, #tip { transition: none !important; }
	#status.is-leaving { transform: none; }
}

		return Object.prototype.hasOwnProperty.call(object, key);
	}
	function shellLanguage() {
		try {
			const save = JSON.parse(localStorage.getItem('sprout_tycoon_save') || 'null');
			if (save && typeof save.language === 'string' && has(SHELL_TEXT, save.language)) {
				return save.language;
			}
		} catch (e) { /* storage blocked or unreadable save */ }
		let code = String(navigator.language || '').trim().replace(/-/g, '_').toLowerCase().split('_')[0];
		code = ({ pt: 'pt_BR', in: 'id' })[code] || code;
		return has(SHELL_TEXT, code) ? code : 'en';
	}
	const SHELL_LANG = shellLanguage();
	const TEXT = SHELL_TEXT[SHELL_LANG];
	document.documentElement.lang = SHELL_LANG.replace('_', '-');
	statusText.textContent = TEXT.lines[0];
	tipLabel.textContent = TEXT.tip;
	const LINES = TEXT.lines;
	const TIPS = TEXT.tips;

	let initializing = true;
	let contextLost = false;
	let tabStopped = false;

	// One farm at a time (QA 4 web): with the game open in two tabs, the older tab (left in the background) used to
	// overwrite the progress made in the newer one. Each page announces itself as soon as it opens (long before the
	// game reads its save); a page that hears about a newer one calls the game back (autoloads/save_manager.gd: one
	// last save, then never again), and the game asks this screen to come back with a message (showReplaced). A tap
	// reloads the page, which loads the latest save and becomes the newest tab in turn.
	const tab = { at: Date.now(), id: Math.random().toString(36).slice(2) };
	let tabReplaced = false;
	let onTabReplaced = null;
	let tabChannel = null;
	function otherTab(other) {
		if (other && (other.at > tab.at || (other.at === tab.at && String(other.id) > tab.id))) {
			tabReplaced = true;
			if (onTabReplaced) {
				onTabReplaced();
			}
		}
	}
	try {
		tabChannel = new BroadcastChannel('sprout_tycoon_tabs');
		tabChannel.onmessage = function (ev) {
			otherTab(ev.data || {});
		};
		tabChannel.postMessage(tab);
	} catch (e) { /* no BroadcastChannel (Safari < 15.4): the localStorage announce below */ }
	// The same announce through localStorage, whose 'storage' event reaches the other tabs in every browser (without
	// BroadcastChannel, an older tab still playing in another window kept autosaving and stopped the newer one instead).
	// The key is not a save. (The game also never rewrites a save changed by another tab since its last read / write.)
	window.addEventListener('storage', function (ev) {
		if (ev.key === 'sprout_tycoon_tab' && ev.newValue) {
			try {
				otherTab(JSON.parse(ev.newValue));
			} catch (e) { /* unreadable */ }
		}
	});
	try {
		localStorage.setItem('sprout_tycoon_tab', JSON.stringify(tab));
	} catch (e) { /* storage blocked: nothing can be passed to another tab anyway */ }
	window.SproutTabs = {
		channel: tabChannel,
		// cb() is called when a newer tab of the game opens (right away if it already has).
		onReplaced: function (cb) {
			onTabReplaced = cb;
			if (tabReplaced) {
				cb();
			}
		},
		// The game stopped saving here: this screen comes back over it with the (translated) message; a tap reloads.
		showReplaced: function (text) {
			if (tabStopped) {
				return;
			}
			tabStopped = true;
			initializing = false;
			clearInterval(lineTimer);
			clearInterval(tipTimer);
			statusOverlay.classList.remove('is-leaving');
			document.body.appendChild(statusOverlay);
			setStatusNotice(text || TEXT.tab);
			statusOverlay.classList.add('is-error');
			statusOverlay.addEventListener('click', function () {
				window.location.reload();
			});
		},
	};
	let target = 0; // 0..100, where the bar wants to be
	let shown = 0; // 0..100, what is drawn
	let starting = false; // download done, engine booting
	let lineIndex = 0;
	let tipIndex = Math.floor(Math.random() * TIPS.length);
	tipText.textContent = TIPS[tipIndex];

	function swapText(el, box, text) {
		if (reduceMotion) {
			el.textContent = text;
			return;
		}
		box.classList.add('fade');
		setTimeout(() => {
			el.textContent = text;
			box.classList.remove('fade');
		}, 250);
	}

	const lineTimer = setInterval(() => {
		if (starting) {
			return;
		}
		lineIndex = (lineIndex + 1) % LINES.length;
		swapText(statusText, statusText, LINES[lineIndex]);
	}, 2200);
	const tipTimer = setInterval(() => {
		tipIndex = (tipIndex + 1) % TIPS.length;
		swapText(tipText, tipBox, TIPS[tipIndex]);
	}, 5000);

	function draw() {
		const pct = Math.max(0, Math.min(100, shown));
		// Keep a visible gold nub from the start so the bar never looks empty/broken.
		barFill.style.width = 'max(' + pct.toFixed(2) + '%, 2.2em)';
		barText.textContent = Math.floor(pct) + '%';
		statusOverlay.setAttribute('aria-valuenow', String(Math.floor(pct)));
	}

	let lastT = 0;
	function tick(t) {
		if (!initializing) {
			return;
		}
		const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
		lastT = t;
		if (starting && target < 99) {
			// Engine compiling / starting: creep slowly towards 99%.
			target += (99 - target) * Math.min(1, dt * 0.6);
		}
		shown += (target - shown) * (reduceMotion ? 1 : Math.min(1, dt * 8));
		draw();
		window.requestAnimationFrame(tick);
	}
	draw();
	window.requestAnimationFrame(tick);

	function finish() {
		if (!initializing || tabStopped) {
			return;
		}
		initializing = false;
		clearInterval(lineTimer);
		clearInterval(tipTimer);
		shown = target = 100;
		draw();
		if (reduceMotion) {
			statusOverlay.remove();
			return;
		}
		statusOverlay.classList.add('is-leaving');
		setTimeout(() => {
			if (!contextLost && !tabStopped) {
				statusOverlay.remove();
			}
		}, 550);
	}

	// Called by the title screen (scenes/title.gd) once it has drawn its first frame, so the
	// overlay fades straight into the title screen and the engine boot splash is never seen.
	window.SproutBootDone = function () {
		finish();
	};

	// WebGL context lost (graphics reset by the browser: phone low on memory, GPU driver reset...): the engine cannot
	// rebuild its images, and its own handler shows a blocking alert() then leaves a grey screen. Instead: this loading
	// screen comes back and the page reloads as soon as it is visible (the game saves when the page is left).
	// Lost again soon after such a reload: no reload loop, a message asks to tap to reload.
	statusOverlay.addEventListener('contextmenu', (ev) => ev.preventDefault());
	// iOS Safari ignores user-scalable=no: a pinch on the page (loading screen, edges) would zoom it. Its own
	// "gesture" events are cancelled (the canvas already cancels its touches).
	document.addEventListener('gesturestart', (ev) => ev.preventDefault(), { passive: false });
	// Portal rule (17/10/2026): inside the portal's iframe, scrolling on the game must never scroll the portal page
	// around it (the browser passes a scroll the game page cannot use on to the parent page). The game itself never
	// scrolls the page: mouse wheel and space / arrows / page keys have their default action cancelled here (the engine
	// still receives them: the farm and the panels scroll with the wheel as before). Finger drags: `touch-action: none`
	// and `overscroll-behavior: none` above (no touchmove cancelling: it would swallow slightly moving taps).
	const SCROLL_KEYS = [' ', 'Spacebar', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'];
	window.addEventListener('wheel', (ev) => ev.preventDefault(), { passive: false });
	window.addEventListener('keydown', (ev) => {
		if (SCROLL_KEYS.indexOf(ev.key) >= 0 || ev.code === 'Space') ev.preventDefault();
	}, { passive: false });
	const canvasElement = document.getElementById('canvas');
	window.addEventListener('webglcontextlost', function (ev) {
		if (ev.target !== canvasElement || contextLost) {
			return;
		}
		ev.preventDefault();
		ev.stopImmediatePropagation();
		contextLost = true;
		initializing = false;
		clearInterval(lineTimer);
		clearInterval(tipTimer);
		const reload = function () {
			try {
				sessionStorage.setItem('sprout_gl_reload', String(Date.now()));
			} catch (e) { /* storage blocked */ }
			window.location.reload();
		};
		let last = 0;
		try {
			last = Number(sessionStorage.getItem('sprout_gl_reload')) || 0;
		} catch (e) { /* storage blocked */ }
		statusOverlay.classList.remove('is-leaving');
		document.body.appendChild(statusOverlay);
		if (Date.now() - last < 60000) {
			setStatusNotice(TEXT.graphics);
			statusOverlay.classList.add('is-error');
			statusOverlay.addEventListener('click', reload);
			return;
		}
		statusText.textContent = TEXT.wake;
		if (document.visibilityState === 'visible') {
			setTimeout(reload, 300);
			return;
		}
		document.addEventListener('visibilitychange', function onShow() {
			if (document.visibilityState === 'visible') {
				document.removeEventListener('visibilitychange', onShow);
				reload();
			}
		});
	}, true);

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		let detail = TEXT.unknown;
		if (err instanceof Error) {
			detail = err.message;
		} else if (typeof err === 'string') {
			detail = err;
		}
		setStatusNotice(TEXT.failed + '\n\n(' + detail + ')');
		statusOverlay.classList.add('is-error');
		initializing = false;
		clearInterval(lineTimer);
		clearInterval(tipTimer);
		// QA 4 web: the engine gives up a download after 4 tries 1 s apart, so a phone losing its signal for a few
		// seconds (tunnel, lift) stayed on this notice. The game now reloads by itself when the connection comes back,
		// and a tap on the notice reloads it too (only the game: inside a portal, its page stays).
		if (!retryArmed) {
			retryArmed = true;
			window.addEventListener('online', function () {
				window.location.reload();
			}, { once: true });
			statusOverlay.addEventListener('click', function () {
				window.location.reload();
			});
		}
	}
	let retryArmed = false;

	// QA 4 web: a download cut half way (connection lost, phone switching from Wi-Fi to 4G) left this screen stuck
	// forever: the engine's loader (index.js, getTrackedResponse) never notices a body that fails in the middle, so it
	// neither retries nor reports an error. The two big files (engine and game data) are read here instead: when the
	// connection breaks, the file is asked again (every 1 to 5 s, at once when the browser is back online), the part
	// already passed on is skipped, and the engine sees one uninterrupted download. After 40 failed tries in a row, the
	// "could not load" notice (which reloads when the connection comes back, or on a tap).
	(function () {
		const baseFetch = window.fetch.bind(window);
		const BIG_FILE = /(^|\/)index\.(wasm|pck)(\?.*)?$/;
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			if (!BIG_FILE.test(url)) {
				return baseFetch(input, init);
			}
			return baseFetch(input, init).then(function (first) {
				if (!first.ok || !first.body) {
					return first;
				}
				let reader = first.body.getReader();
				let passed = 0;
				let failures = 0;
				const pause = function () {
					return new Promise(function (resolve) {
						const delay = Math.min(5000, 1000 * (1 + failures));
						const timer = setTimeout(done, delay);
						function done() {
							clearTimeout(timer);
							window.removeEventListener('online', done);
							resolve();
						}
						window.addEventListener('online', done);
					});
				};
				// New request, then skip the bytes the engine already has.
				const resume = function () {
					failures += 1;
					if (failures > 40) {
						displayFailureNotice(new Error('Download interrupted (' + url.split('/').pop() + ').'));
						return new Promise(function () {});
					}
					return pause().then(function () {
						return baseFetch(input, init);
					}).then(function (again) {
						if (!again.ok || !again.body) {
							throw new Error('HTTP ' + again.status);
						}
						const next = again.body.getReader();
						let skipped = 0;
						const skip = function () {
							if (skipped >= passed) {
								reader = next;
								return null;
							}
							return next.read().then(function (r) {
								if (r.done) {
									throw new Error('shorter file');
								}
								if (skipped + r.value.length <= passed) {
									skipped += r.value.length;
									return skip();
								}
								const rest = r.value.subarray(passed - skipped);
								skipped = passed;
								reader = next;
								return rest;
							});
						};
						return skip();
					}).catch(function () {
						return resume();
					});
				};
				const body = new ReadableStream({
					pull: function (controller) {
						return reader.read().then(function (r) {
							if (r.done) {
								controller.close();
								return;
							}
							failures = 0;
							passed += r.value.length;
							controller.enqueue(r.value);
						}, function () {
							return resume().then(function (rest) {
								if (rest && rest.length) {
									passed += rest.length;
									controller.enqueue(rest);
								}
							});
						});
					},
				});
				return new Response(body, { status: first.status, statusText: first.statusText, headers: first.headers });
			});
		};
	}());

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Your browser is missing something the game needs:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					// Downloading the engine and the game data = first 90% of the bar.
					target = Math.max(target, Math.min(90, (current / total) * 90));
					if (current >= total && !starting) {
						starting = true;
						swapText(statusText, statusText, 'Waking up the farm…');
					}
				}
			},
		}).then(() => {
			if (!starting) {
				starting = true;
				swapText(statusText, statusText, 'Waking up the farm…');
			}
			// Safety net: if the title screen never says it is ready, fade out anyway.
			setTimeout(finish, 20000);
		}, displayFailureNotice);
	}
}());
</script>
</body>
</html>
